---
- name: Setup Vprofile VPC
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ---------------------------------------------------------
    # VARIABLES
    # ---------------------------------------------------------

    - name: Import VPC variables
      ansible.builtin.include_vars:
        file: vars/vpc_setup


    # ---------------------------------------------------------
    # VPC
    # ---------------------------------------------------------

    - name: Create Vprofile VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpcCidr }}"
        region: "{{ region }}"
        dns_support: true
        dns_hostnames: true
        tenancy: default
        state: "{{ state }}"
        tags:
          Name: "{{ vpc_name }}"
          Project: Vprofile
      register: vpcout

    - name: Display VPC ID
      ansible.builtin.debug:
        msg: "VPC ID: {{ vpcout.vpc.id }}"


    # ---------------------------------------------------------
    # PUBLIC SUBNET 1
    # ---------------------------------------------------------

    - name: Create Public Subnet 1
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        az: "{{ zone1 }}"
        state: "{{ state }}"
        cidr: "{{ PubSub1Cidr }}"
        map_public: true
        tags:
          Name: vprofile-pubsub1
          Tier: Public
          Project: Vprofile
      register: pubsub1_out


    # ---------------------------------------------------------
    # PUBLIC SUBNET 2
    # ---------------------------------------------------------

    - name: Create Public Subnet 2
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        az: "{{ zone2 }}"
        state: "{{ state }}"
        cidr: "{{ PubSub2Cidr }}"
        map_public: true
        tags:
          Name: vprofile-pubsub2
          Tier: Public
          Project: Vprofile
      register: pubsub2_out


    # ---------------------------------------------------------
    # PUBLIC SUBNET 3
    # ---------------------------------------------------------

    - name: Create Public Subnet 3
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        az: "{{ zone3 }}"
        state: "{{ state }}"
        cidr: "{{ PubSub3Cidr }}"
        map_public: true
        tags:
          Name: vprofile-pubsub3
          Tier: Public
          Project: Vprofile
      register: pubsub3_out


    # ---------------------------------------------------------
    # PRIVATE SUBNET 1
    # ---------------------------------------------------------

    - name: Create Private Subnet 1
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        az: "{{ zone1 }}"
        state: "{{ state }}"
        cidr: "{{ PrivSub1Cidr }}"
        map_public: false
        tags:
          Name: vprofile-privsub1
          Tier: Private
          Project: Vprofile
      register: privsub1_out


    # ---------------------------------------------------------
    # PRIVATE SUBNET 2
    # ---------------------------------------------------------

    - name: Create Private Subnet 2
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        az: "{{ zone2 }}"
        state: "{{ state }}"
        cidr: "{{ PrivSub2Cidr }}"
        map_public: false
        tags:
          Name: vprofile-privsub2
          Tier: Private
          Project: Vprofile
      register: privsub2_out


    # ---------------------------------------------------------
    # PRIVATE SUBNET 3
    # ---------------------------------------------------------

    - name: Create Private Subnet 3
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        az: "{{ zone3 }}"
        state: "{{ state }}"
        cidr: "{{ PrivSub3Cidr }}"
        map_public: false
        tags:
          Name: vprofile-privsub3
          Tier: Private
          Project: Vprofile
      register: privsub3_out


    # ---------------------------------------------------------
    # INTERNET GATEWAY
    # ---------------------------------------------------------

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{ state }}"
        tags:
          Name: vprofile-IGW
          Project: Vprofile
      register: igw_out


    # ---------------------------------------------------------
    # PUBLIC ROUTE TABLE
    # ---------------------------------------------------------

    - name: Create Public Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{ state }}"
        tags:
          Name: Vprofile-PubRT
          Tier: Public
          Project: Vprofile
        subnets:
          - "{{ pubsub1_out.subnet.id }}"
          - "{{ pubsub2_out.subnet.id }}"
          - "{{ pubsub3_out.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw_out.gateway_id }}"
      register: pubRT_out


    # ---------------------------------------------------------
    # NAT GATEWAY
    # ---------------------------------------------------------

    - name: Create NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        state: "{{ state }}"
        subnet_id: "{{ pubsub1_out.subnet.id }}"
        wait: true
        wait_timeout: 300
        region: "{{ region }}"
        if_exist_do_not_create: true
        tags:
          Name: Vprofile-NATGW
          Project: Vprofile
      register: NATGW_out


    # ---------------------------------------------------------
    # PRIVATE ROUTE TABLE
    # ---------------------------------------------------------

    - name: Create Private Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpcout.vpc.id }}"
        region: "{{ region }}"
        state: "{{ state }}"
        tags:
          Name: Vprofile-PrivRT
          Tier: Private
          Project: Vprofile
        subnets:
          - "{{ privsub1_out.subnet.id }}"
          - "{{ privsub2_out.subnet.id }}"
          - "{{ privsub3_out.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            nat_gateway_id: "{{ NATGW_out.nat_gateway_id }}"
      register: privRT_out


    # ---------------------------------------------------------
    # DISPLAY OUTPUT
    # ---------------------------------------------------------

    - name: Display VPC infrastructure IDs
      ansible.builtin.debug:
        msg:
          - "VPC ID: {{ vpcout.vpc.id }}"
          - "Public Subnet 1: {{ pubsub1_out.subnet.id }}"
          - "Public Subnet 2: {{ pubsub2_out.subnet.id }}"
          - "Public Subnet 3: {{ pubsub3_out.subnet.id }}"
          - "Private Subnet 1: {{ privsub1_out.subnet.id }}"
          - "Private Subnet 2: {{ privsub2_out.subnet.id }}"
          - "Private Subnet 3: {{ privsub3_out.subnet.id }}"
          - "Internet Gateway: {{ igw_out.gateway_id }}"
          - "Public Route Table: {{ pubRT_out.route_table.id }}"
          - "NAT Gateway: {{ NATGW_out.nat_gateway_id }}"
          - "Private Route Table: {{ privRT_out.route_table.id }}"


    # ---------------------------------------------------------
    # SAVE OUTPUT VARIABLES
    # ---------------------------------------------------------

    - name: Save VPC output variables
      ansible.builtin.copy:
        dest: vars/output_vars
        mode: "0644"
        content: |
          vpcid: "{{ vpcout.vpc.id }}"
          pubsub1id: "{{ pubsub1_out.subnet.id }}"
          pubsub2id: "{{ pubsub2_out.subnet.id }}"
          pubsub3id: "{{ pubsub3_out.subnet.id }}"
          privsub1id: "{{ privsub1_out.subnet.id }}"
          privsub2id: "{{ privsub2_out.subnet.id }}"
          privsub3id: "{{ privsub3_out.subnet.id }}"
          igwid: "{{ igw_out.gateway_id }}"
          pubRTid: "{{ pubRT_out.route_table.id }}"
          NATGWid: "{{ NATGW_out.nat_gateway_id }}"
          privRTid: "{{ privRT_out.route_table.id }}"