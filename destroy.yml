---
- name: Destroy Vprofile Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ---------------------------------------------------------
    # VARIABLES
    # ---------------------------------------------------------

    - name: Import VPC setup variables
      ansible.builtin.include_vars:
        file: vars/vpc_setup

    - name: Import VPC output variables
      ansible.builtin.include_vars:
        file: vars/vpc-output_vars

    - name: Import Bastion output variables
      ansible.builtin.include_vars:
        file: vars/bastion-output_vars


    # ---------------------------------------------------------
    # TERMINATE BASTION HOST
    # ---------------------------------------------------------

    - name: Terminate Bastion Host
      amazon.aws.ec2_instance:
        region: "{{ region }}"
        state: absent
        filters:
          "tag:Name": Bastion_host
          "tag:Project": Vprofile
          "instance-state-name":
            - pending
            - running
            - stopping
            - stopped
        wait: true
        wait_timeout: 300


    # ---------------------------------------------------------
    # DELETE BASTION SECURITY GROUP
    # ---------------------------------------------------------

    - name: Delete Bastion security group
      amazon.aws.ec2_security_group:
        name: Bastion-host-sg
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        state: absent


    # ---------------------------------------------------------
    # DELETE SSH KEY PAIR
    # ---------------------------------------------------------

    - name: Delete Vprofile EC2 key pair
      amazon.aws.ec2_key:
        name: vprofile-key
        region: "{{ region }}"
        state: absent

    - name: Remove local bastion-key.pem file
      ansible.builtin.file:
        path: "./bastion-key.pem"
        state: absent


    # ---------------------------------------------------------
    # DELETE NAT GATEWAY
    # ---------------------------------------------------------

    - name: Delete NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        nat_gateway_id: "{{ NATGWid }}"
        region: "{{ region }}"
        state: absent
        release_eip: true
        wait: true
        wait_timeout: 300


    # ---------------------------------------------------------
    # DELETE PRIVATE ROUTE TABLE
    # ---------------------------------------------------------

    - name: Delete Private Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        route_table_id: "{{ privRTid }}"
        lookup: id
        state: absent


    # ---------------------------------------------------------
    # DELETE PUBLIC ROUTE TABLE
    # ---------------------------------------------------------

    - name: Delete Public Route Table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        route_table_id: "{{ pubRTid }}"
        lookup: id
        state: absent


    # ---------------------------------------------------------
    # DELETE INTERNET GATEWAY
    # ---------------------------------------------------------

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        state: absent


    # ---------------------------------------------------------
    # DELETE PRIVATE SUBNETS
    # ---------------------------------------------------------

    - name: Delete Private Subnet 1
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        cidr: "{{ PrivSub1Cidr }}"
        state: absent

    - name: Delete Private Subnet 2
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        cidr: "{{ PrivSub2Cidr }}"
        state: absent

    - name: Delete Private Subnet 3
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        cidr: "{{ PrivSub3Cidr }}"
        state: absent


    # ---------------------------------------------------------
    # DELETE PUBLIC SUBNETS
    # ---------------------------------------------------------

    - name: Delete Public Subnet 1
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        cidr: "{{ PubSub1Cidr }}"
        state: absent

    - name: Delete Public Subnet 2
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        cidr: "{{ PubSub2Cidr }}"
        state: absent

    - name: Delete Public Subnet 3
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        cidr: "{{ PubSub3Cidr }}"
        state: absent


    # ---------------------------------------------------------
    # DELETE VPC
    # ---------------------------------------------------------

    - name: Delete Vprofile VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpcCidr }}"
        region: "{{ region }}"
        state: absent


    # ---------------------------------------------------------
    # REMOVE GENERATED OUTPUT FILES
    # ---------------------------------------------------------

    - name: Remove vars/vpc-output_vars file
      ansible.builtin.file:
        path: vars/vpc-output_vars
        state: absent

    - name: Remove vars/bastion-output_vars file
      ansible.builtin.file:
        path: vars/bastion-output_vars
        state: absent