---
- name: Destroy Vprofile AWS Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # =========================================================
    # LOAD VARIABLES
    # =========================================================

    - name: Import VPC variables
      ansible.builtin.include_vars:
        file: vars/vpc_setup

    - name: Check if VPC output variables exist
      ansible.builtin.stat:
        path: vars/output_vars
      register: output_vars_file


    # =========================================================
    # SAFETY CONFIRMATION
    # =========================================================

    - name: Confirm infrastructure destruction
      ansible.builtin.pause:
        prompt: |
          ==========================================================
          WARNING: VPROFILE AWS INFRASTRUCTURE DESTRUCTION
          ==========================================================

          This playbook will DELETE:

            - Bastion EC2 instance
            - Bastion Security Group
            - NAT Gateway
            - Private Route Table
            - Public Route Table
            - Internet Gateway
            - 3 Private Subnets
            - 3 Public Subnets
            - Vprofile VPC
            - vars/output_vars

          Region: {{ region }}
          VPC:    {{ vpc_name }}

          This action cannot be easily undone.

          Type DESTROY to continue.
          ==========================================================
      register: destroy_confirmation

    - name: Cancel destruction
      ansible.builtin.fail:
        msg: "Destruction cancelled. You did not type DESTROY."
      when: destroy_confirmation.user_input != "DESTROY"


    # =========================================================
    # CHECK OUTPUT VARIABLES
    # =========================================================

    - name: Stop if output variables do not exist
      ansible.builtin.fail:
        msg: |
          vars/output_vars does not exist.

          The VPC resource IDs cannot be safely determined.
          Destruction has been stopped.
      when: not output_vars_file.stat.exists


    # =========================================================
    # IMPORT OUTPUT VARIABLES
    # =========================================================

    - name: Import VPC output variables
      ansible.builtin.include_vars:
        file: vars/output_vars


    # =========================================================
    # DISPLAY RESOURCES
    # =========================================================

    - name: Display resources that will be destroyed
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "VPROFILE RESOURCES TO BE DESTROYED"
          - "=========================================================="
          - "VPC ID: {{ vpcid }}"
          - "Public Subnet 1: {{ pubsub1id }}"
          - "Public Subnet 2: {{ pubsub2id }}"
          - "Public Subnet 3: {{ pubsub3id }}"
          - "Private Subnet 1: {{ privsub1id }}"
          - "Private Subnet 2: {{ privsub2id }}"
          - "Private Subnet 3: {{ privsub3id }}"
          - "Internet Gateway: {{ igwid }}"
          - "Public Route Table: {{ pubRTid }}"
          - "NAT Gateway: {{ NATGWid }}"
          - "Private Route Table: {{ privRTid }}"
          - "=========================================================="


    # =========================================================
    # TERMINATE BASTION HOST
    # =========================================================

    - name: Terminate Bastion Host
      amazon.aws.ec2_instance:
        name: Bastion_host
        region: "{{ region }}"
        state: absent
        wait: true
        wait_timeout: 300
      register: bastion_termination

    - name: Display Bastion termination result
      ansible.builtin.debug:
        msg: "Bastion Host termination completed."


    # =========================================================
    # FIND BASTION SECURITY GROUP
    # =========================================================

    - name: Find Bastion Security Group
      amazon.aws.ec2_security_group_info:
        region: "{{ region }}"
        filters:
          group-name: Bastion-host-sg
          vpc-id: "{{ vpcid }}"
      register: bastion_sg_info


    # =========================================================
    # DISPLAY SECURITY GROUP
    # =========================================================

    - name: Display Bastion Security Group ID
      ansible.builtin.debug:
        msg:
          - "Bastion Security Group ID: {{ bastion_sg_info.security_groups[0].group_id }}"
      when: bastion_sg_info.security_groups | length > 0


    # =========================================================
    # WAIT FOR BASTION ENIs TO DISAPPEAR
    #
    # AWS may take some time to release the network interface
    # after terminating the EC2 instance.
    # =========================================================

    - name: Wait for Bastion ENIs to be released
      ansible.builtin.shell: |
        aws ec2 describe-network-interfaces \
          --region "{{ region }}" \
          --filters Name=group-id,Values="{{ bastion_sg_info.security_groups[0].group_id }}" \
          --query 'NetworkInterfaces[].NetworkInterfaceId' \
          --output text
      register: bastion_eni_check
      until: bastion_eni_check.stdout | trim == ""
      retries: 30
      delay: 10
      changed_when: false
      when: bastion_sg_info.security_groups | length > 0


    # =========================================================
    # DELETE BASTION SECURITY GROUP
    # =========================================================

    - name: Delete Bastion Security Group
      amazon.aws.ec2_security_group:
        name: Bastion-host-sg
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        state: absent
      when: bastion_sg_info.security_groups | length > 0

    - name: Display Security Group deletion result
      ansible.builtin.debug:
        msg: "Bastion Security Group has been deleted."


    # =========================================================
    # DELETE NAT GATEWAY
    # =========================================================

    - name: Delete NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        nat_gateway_id: "{{ NATGWid }}"
        region: "{{ region }}"
        state: absent
        wait: true
        wait_timeout: 300
      register: natgw_delete

    - name: Display NAT Gateway deletion result
      ansible.builtin.debug:
        msg: "NAT Gateway deletion completed."


    # =========================================================
    # WAIT FOR NAT GATEWAY TO BE FULLY DELETED
    #
    # This prevents dependency errors when deleting subnets/VPC.
    # =========================================================

    - name: Wait for NAT Gateway to disappear
      ansible.builtin.shell: |
        aws ec2 describe-nat-gateways \
          --region "{{ region }}" \
          --nat-gateway-ids "{{ NATGWid }}" \
          --query 'NatGateways[0].State' \
          --output text
      register: natgw_status
      until: >
        natgw_status.rc != 0 or
        natgw_status.stdout | trim == "deleted"
      retries: 30
      delay: 10
      changed_when: false


    # =========================================================
    # DELETE PRIVATE ROUTE TABLE
    # =========================================================

    - name: Delete Private Route Table
      amazon.aws.ec2_vpc_route_table:
        route_table_id: "{{ privRTid }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE PUBLIC ROUTE TABLE
    # =========================================================

    - name: Delete Public Route Table
      amazon.aws.ec2_vpc_route_table:
        route_table_id: "{{ pubRTid }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE INTERNET GATEWAY
    # =========================================================

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        state: absent
      register: igw_delete

    - name: Display Internet Gateway deletion result
      ansible.builtin.debug:
        msg: "Internet Gateway deletion completed."


    # =========================================================
    # DELETE PRIVATE SUBNET 1
    # =========================================================

    - name: Delete Private Subnet 1
      amazon.aws.ec2_vpc_subnet:
        subnet_id: "{{ privsub1id }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE PRIVATE SUBNET 2
    # =========================================================

    - name: Delete Private Subnet 2
      amazon.aws.ec2_vpc_subnet:
        subnet_id: "{{ privsub2id }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE PRIVATE SUBNET 3
    # =========================================================

    - name: Delete Private Subnet 3
      amazon.aws.ec2_vpc_subnet:
        subnet_id: "{{ privsub3id }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE PUBLIC SUBNET 1
    # =========================================================

    - name: Delete Public Subnet 1
      amazon.aws.ec2_vpc_subnet:
        subnet_id: "{{ pubsub1id }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE PUBLIC SUBNET 2
    # =========================================================

    - name: Delete Public Subnet 2
      amazon.aws.ec2_vpc_subnet:
        subnet_id: "{{ pubsub2id }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # DELETE PUBLIC SUBNET 3
    # =========================================================

    - name: Delete Public Subnet 3
      amazon.aws.ec2_vpc_subnet:
        subnet_id: "{{ pubsub3id }}"
        region: "{{ region }}"
        state: absent


    # =========================================================
    # WAIT FOR SUBNETS TO DISAPPEAR
    # =========================================================

    - name: Wait for Vprofile subnets to be deleted
      ansible.builtin.shell: |
        aws ec2 describe-subnets \
          --region "{{ region }}" \
          --filters Name=vpc-id,Values="{{ vpcid }}" \
          --query 'Subnets[].SubnetId' \
          --output text
      register: subnet_check
      until: subnet_check.stdout | trim == ""
      retries: 30
      delay: 5
      changed_when: false


    # =========================================================
    # DELETE VPROFILE VPC
    # =========================================================

    - name: Delete Vprofile VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        region: "{{ region }}"
        state: absent
      register: vpc_delete

    - name: Display VPC deletion result
      ansible.builtin.debug:
        msg: "Vprofile VPC has been deleted."


    # =========================================================
    # REMOVE LOCAL OUTPUT VARIABLES
    # =========================================================

    - name: Remove VPC output variables
      ansible.builtin.file:
        path: vars/output_vars
        state: absent


    # =========================================================
    # FINAL MESSAGE
    # =========================================================

    - name: Destruction completed
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "VPROFILE AWS INFRASTRUCTURE DESTROYED"
          - "=========================================================="
          - "VPC: {{ vpc_name }}"
          - "Region: {{ region }}"
          - "Bastion: Terminated"
          - "Bastion Security Group: Deleted"
          - "NAT Gateway: Deleted"
          - "Route Tables: Deleted"
          - "Internet Gateway: Deleted"
          - "Subnets: Deleted"
          - "VPC: Deleted"
          - "Local output_vars: Removed"
          - "=========================================================="

