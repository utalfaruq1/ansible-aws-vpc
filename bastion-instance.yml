---
- name: Setup Vprofile Bastion Host
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ---------------------------------------------------------
    # VARIABLES
    # ---------------------------------------------------------

    - name: Import VPC setup variables
      ansible.builtin.include_vars:
        file: vars/vpc_setup

    - name: Import VPC output variables
      ansible.builtin.include_vars:
        file: vars/output_vars


    # ---------------------------------------------------------
    # SSH KEY PAIR
    # ---------------------------------------------------------

    - name: Create Vprofile EC2 key pair
      amazon.aws.ec2_key:
        name: vprofile-key
        region: "{{ region }}"
      register: key_out

    - name: Save private key to bastion-key.pem
      ansible.builtin.copy:
        content: "{{ key_out.key.private_key }}"
        dest: "./bastion-key.pem"
        mode: "0600"
      when:
        - key_out.changed
        - key_out.key.private_key is defined


    # ---------------------------------------------------------
    # BASTION SECURITY GROUP
    # ---------------------------------------------------------

    - name: Create Bastion security group
      amazon.aws.ec2_security_group:
        name: Bastion-host-sg
        description: Security group for Vprofile Bastion host
        vpc_id: "{{ vpcid }}"
        region: "{{ region }}"
        state: present

        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ MYIP }}"
            rule_desc: Allow SSH access to Bastion

      register: BastionSG_out


    # ---------------------------------------------------------
    # BASTION EC2 INSTANCE
    # ---------------------------------------------------------

    - name: Create or maintain Bastion Host
      amazon.aws.ec2_instance:
        name: Bastion_host

        key_name: vprofile-key

        region: "{{ region }}"

        instance_type: t2.micro

        image_id: "{{ bastion_ami }}"

        vpc_subnet_id: "{{ pubsub1id }}"

        security_group: "{{ BastionSG_out.group_id }}"

        network:
          assign_public_ip: true

        tags:
          Name: Bastion_host
          Project: Vprofile
          Owner: DevOps Team

        state: running

        exact_count: 1

        filters:
          "tag:Name": Bastion_host
          "tag:Project": Vprofile
          "instance-state-name":
            - pending
            - running
            - stopping
            - stopped

        wait: true
        wait_timeout: 300

      register: bastionHost_out


    # ---------------------------------------------------------
    # DISPLAY BASTION INFORMATION
    # ---------------------------------------------------------

    - name: Display Bastion Host information
      ansible.builtin.debug:
        msg:
          - "Bastion Instance ID: {{ bastionHost_out.instances[0].instance_id }}"
          - "Bastion State: {{ bastionHost_out.instances[0].state.name }}"
          - "Bastion Private IP: {{ bastionHost_out.instances[0].private_ip_address | default('N/A') }}"
          - "Bastion Public IP: {{ bastionHost_out.instances[0].public_ip_address | default('N/A') }}"